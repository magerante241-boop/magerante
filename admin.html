<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGERANTE — Admin</title>
<style>
  body { font-family: sans-serif; background:#faf3e0; margin:0; padding:20px; }
  h1 { color:#1b5e20; }
  #loginBox input { display:block; width:100%; max-width:320px; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #ccc; }
  #loginBox button { padding:10px 20px; border-radius:8px; border:none; background:#1b5e20; color:white; font-weight:bold; }
  #adminError { color:#b00020; }
  .compte-card { background:white; border-radius:10px; padding:16px; margin:12px 0; box-shadow:0 1px 4px rgba(0,0,0,0.1); }
  .compte-card button { margin-top:8px; padding:8px 16px; border-radius:8px; border:none; background:#2e7d32; color:white; font-weight:bold; }
</style>
</head>
<body>
  <h1>MAGERANTE — Administration</h1>

  <div id="loginBox">
    <p>Connexion admin</p>
    <input type="email" id="adminEmail" placeholder="Email">
    <input type="password" id="adminPassword" placeholder="Mot de passe">
    <button id="btnAdminLogin">Se connecter</button>
    <p id="adminError"></p>
  </div>

  <div id="adminPanel" hidden>
    <p>Connecté en tant qu'admin.</p>
    <h2>Comptes propriétaires en attente de validation</h2>
    <div id="pendingList">Chargement...</div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
