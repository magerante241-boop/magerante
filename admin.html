<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MAGERANTE — Admin</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f4ede0;
    margin: 0;
    padding: 0;
    color: #2b2b2b;
  }
  header {
    background: linear-gradient(135deg, #1b5e20, #2e7d32);
    color: white;
    padding: 20px;
  }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  .container { padding: 16px; max-width: 700px; margin: 0 auto; }

  #loginBox { max-width: 340px; margin: 40px auto; padding: 20px; }
  #loginBox input {
    display: block; width: 100%; padding: 12px; margin: 8px 0;
    border-radius: 10px; border: 1px solid #ccc; font-size: 15px;
  }
  #loginBox button {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: #1b5e20; color: white; font-weight: bold; font-size: 15px;
  }
  #adminError { color: #b00020; font-size: 14px; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 16px 0 24px;
  }
  .stat-card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .stat-card .icon { font-size: 22px; }
  .stat-card .value { font-size: 24px; font-weight: bold; margin: 6px 0 2px; color: #1b5e20; }
  .stat-card .label { font-size: 12px; color: #666; }
  .stat-card.wide { grid-column: 1 / -1; }
  .stat-card.wide .value { color: #b8860b; }

  h2.section-title { font-size: 17px; margin: 24px 0 10px; color: #1b5e20; }

  .compte-card {
    background: white; border-radius: 14px; padding: 16px; margin: 10px 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .compte-card strong { font-size: 15px; }
  .compte-card .meta { font-size: 13px; color: #555; margin: 4px 0; }
  .compte-card button {
    margin-top: 10px; padding: 9px 18px; border-radius: 10px; border: none;
    background: #2e7d32; color: white; font-weight: bold; font-size: 14px;
  }
  .empty-msg { color: #888; font-size: 14px; }
</style>
</head>
<body>
  <header>
    <h1>⚙️ MAGERANTE — Administration</h1>
    <p id="headerSub">Tableau de bord</p>
  </header>

  <div class="container">
    <div id="loginBox">
      <p>Connexion admin</p>
      <input type="email" id="adminEmail" placeholder="Email">
      <input type="password" id="adminPassword" placeholder="Mot de passe">
      <button id="btnAdminLogin">Se connecter</button>
      <p id="adminError"></p>
    </div>

    <div id="adminPanel" hidden>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="icon">👥</div>
          <div class="value" id="statTotalComptes">—</div>
          <div class="label">Comptes propriétaires</div>
        </div>
        <div class="stat-card">
          <div class="icon">✅</div>
          <div class="value" id="statValides">—</div>
          <div class="label">Comptes validés</div>
        </div>
        <div class="stat-card">
          <div class="icon">⏳</div>
          <div class="value" id="statEnAttente">—</div>
          <div class="label">En attente de validation</div>
        </div>
        <div class="stat-card">
          <div class="icon">🏢</div>
          <div class="value" id="statEtablissements">—</div>
          <div class="label">Établissements</div>
        </div>
        <div class="stat-card wide">
          <div class="icon">💰</div>
          <div class="value" id="statCAGlobal">—</div>
          <div class="label">Chiffre d'affaires global (tous établissements)</div>
        </div>
      </div>

      <h2 class="section-title">Comptes propriétaires en attente de validation</h2>
      <div id="pendingList" class="empty-msg">Chargement...</div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
