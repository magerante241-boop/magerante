<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Tableau de bord — Magerante</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  body { background:#0f172a; color:#e2e8f0; font-family: system-ui, sans-serif; margin:0; padding:16px; }
  h1 { font-size:1.3rem; } h2 { font-size:1.05rem; margin-top:24px; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin:16px 0; }
  .stat-card { background:#1e293b; border-radius:10px; padding:12px 16px; flex:1; min-width:120px; }
  .stat-card span { display:block; font-size:0.8rem; color:#94a3b8; }
  .stat-card strong { font-size:1.1rem; }
  canvas { background:#1e293b; border-radius:10px; padding:8px; margin-bottom:16px; max-width:100%; }
  ul { list-style:none; padding:0; }
  li { background:#1e293b; padding:8px 12px; border-radius:8px; margin-bottom:6px; }
  button { background:#22c55e; color:#0f172a; border:none; padding:8px 14px; border-radius:8px; font-weight:600; }
  a.back { color:#94a3b8; text-decoration:none; display:inline-block; margin-bottom:10px; }
</style>
</head>
<body>
  <a href="index.html" class="back">&larr; Retour</a>
  <h1>📊 Tableau de bord</h1>
  <div class="stats">
    <div class="stat-card"><span>Aujourd'hui</span><strong id="totalJour">—</strong></div>
    <div class="stat-card"><span>7 derniers jours</span><strong id="totalSemaine">—</strong></div>
    <div class="stat-card"><span>30 derniers jours</span><strong id="totalMois">—</strong></div>
  </div>
  <canvas id="chartVentes" height="180"></canvas>
  <button id="btnRefreshDashboard">🔄 Actualiser</button>
  <h2>Gérants</h2>
  <ul id="listeGerants"><li>Chargement...</li></ul>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
