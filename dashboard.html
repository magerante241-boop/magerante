<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGERANTE — Tableau de bord</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; background:#0d1117; color:#e6edf3; }
  .tabs { display:flex; border-bottom:1px solid #30363d; position:sticky; top:0; background:#0d1117; z-index:10; }
  .tab-btn { flex:1; padding:14px 4px; text-align:center; background:transparent; color:#8b949e; border:none; cursor:pointer; font-size:13px; }
  .tab-btn.active { color:#fff; border-bottom:3px solid #f2c94c; font-weight:bold; }
  .tab-content { display:none; padding:16px; }
  .tab-content.active { display:block; }
  .card { background:#161b22; border-radius:10px; padding:16px; margin-bottom:16px; }
  .stock-alert { background:#3b1f1f; border-left:4px solid #e5484d; padding:10px 14px; border-radius:6px; margin-bottom:16px; }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab-btn active" data-tab="ventes">Ventes</button>
  <button class="tab-btn" data-tab="gerants">Gérants</button>
  <button class="tab-btn" data-tab="rapports">Rapports</button>
  <button class="tab-btn" data-tab="parametres">Paramètres</button>
</div>

<div id="tab-ventes" class="tab-content active">
  <div id="stockAlertBanner"></div>

  <div class="card" id="totauxCard">
    <div id="totalJour"></div>
    <div id="totalSemaine"></div>
    <div id="totalMois"></div>
  </div>

  <div class="card">
    <canvas id="ventesChart" height="180"></canvas>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Répartition par catégorie</h3>
    <canvas id="categorieChart" height="180"></canvas>
  </div>

  <div class="card" id="comparaisonCard">
    <h3 style="margin-top:0;">Période actuelle vs précédente</h3>
    <div id="comparaisonContent"></div>
  </div>

  <div class="card" id="topProduitsCard">
    <h3 style="margin-top:0;">Top 5 produits</h3>
    <div id="topProduitsContent"></div>
  </div>
</div>

<div id="tab-gerants" class="tab-content">
  <div class="card">
    <h3 style="margin-top:0;">Gérants actifs</h3>
    <div id="listeGerants"></div>
  </div>
</div>

<div id="tab-rapports" class="tab-content">
  <div class="card">
    <h3 style="margin-top:0;">Générer un rapport</h3>
    <div id="rapportsBoutons"></div>
  </div>
  <div class="card">
    <h3 style="margin-top:0;">Historique des rapports</h3>
    <div id="historiqueRapports"></div>
  </div>
</div>

<div id="tab-parametres" class="tab-content">
  <div class="card">
    <h3 style="margin-top:0;">Établissement</h3>
    <div id="infoEtablissement"></div>
  </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
