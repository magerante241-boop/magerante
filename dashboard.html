<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGERANTE — Tableau de bord</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: var(--font-main); background:var(--bg); color:var(--text); }
  .tabs { display:flex; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:10; }
  .tab-btn { flex:1; padding:14px 4px; text-align:center; background:transparent; color:var(--muted); border:none; cursor:pointer; font-size:13px; }
  .tab-btn.active { color:var(--primary); border-bottom:3px solid var(--accent); font-weight:bold; }
  .tab-content { display:none; padding:16px; }
  .tab-content.active { display:block; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:16px; margin-bottom:16px; }
  .stock-alert { background:var(--surface2); border-left:4px solid var(--danger); padding:10px 14px; border-radius:6px; margin-bottom:16px; }
  .deficit-alert { background:var(--surface2); border-left:4px solid var(--danger); padding:10px 14px; border-radius:6px; margin-bottom:16px; }
  .deficit-warning { background:var(--surface2); border-left:4px solid var(--accent); padding:10px 14px; border-radius:6px; margin-bottom:16px; }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab-btn active" data-tab="ventes">Ventes</button>
  <button class="tab-btn" data-tab="gerants">Gérants</button>
  <button class="tab-btn" data-tab="rapports">Rapports</button>
  <button class="tab-btn" data-tab="parametres">Paramètres</button>
</div>

<div id="tab-ventes" class="tab-content active">
  <div id="stockAlertBanner"></div>
  <div id="deficitAlertBanner"></div>

  <div class="card" id="totauxCard">
    <div id="totalJour"></div>
    <div id="totalSemaine"></div>
    <div id="totalMois"></div>
  </div>

  <div class="card">
    <canvas id="ventesChart" height="180"></canvas>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Répartition par catégorie</h3>
    <canvas id="categorieChart" height="180"></canvas>
  </div>

  <div class="card" id="comparaisonCard">
    <h3 style="margin-top:0;">Période actuelle vs précédente</h3>
    <div id="comparaisonContent"></div>
  </div>

  <div class="card" id="soldeCard">
    <h3 style="margin-top:0;">Solde (recettes - depenses/achats)</h3>
    <div id="soldeContent"></div>
  </div>

  <div class="card" id="topProduitsCard">
    <h3 style="margin-top:0;">Top 5 produits</h3>
    <div id="topProduitsContent"></div>
  </div>
</div>

<div id="tab-gerants" class="tab-content">
  <div class="card">
    <h3 style="margin-top:0;">Gérants actifs</h3>
    <div id="listeGerants"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Clôtures reçues</h3>
    <div id="filtresClotures" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
      <select id="filtreClotureGerant"><option value="">Tous les gérants</option></select>
      <select id="filtreCloturePeriode">
        <option value="tout">Toute la période</option>
        <option value="jour">Aujourd'hui</option>
        <option value="semaine">Cette semaine</option>
        <option value="mois">Ce mois</option>
      </select>
      <button id="btnExportClotures">📄 Export PDF groupé</button>
    </div>
    <div id="listeClotures"></div>
  </div>
</div>

<div id="tab-rapports" class="tab-content">
  <div class="card">
    <h3 style="margin-top:0;">Générer un rapport</h3>
    <div id="rapportsBoutons">
      <button id="btnRapportJour">Rapport du jour</button>
      <button id="btnRapportSemaine">Rapport de la semaine</button>
      <button id="btnRapportMois">Rapport du mois</button>
    </div>
    <div id="rapportStatus"></div>
  </div>
  <div class="card">
    <h3 style="margin-top:0;">Historique des rapports</h3>
    <div id="historiqueRapports"></div>
  </div>
</div>

<div id="tab-parametres" class="tab-content">
  <div class="card">
    <h3 style="margin-top:0;">Établissement</h3>
    <div id="infoEtablissement"></div>
  </div>
</div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
